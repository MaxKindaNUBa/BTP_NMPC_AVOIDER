# Single shared source for dt, N, weights, bounds, etc. (ROS2_CONVERSION_PLAN.md
# section 4/6). Values below mirror nmpc/config.py's NMPCConfig defaults exactly,
# except MAX_OBSTACLES, which is bumped from its 5-obstacle default to 20 to
# match scenario_maker/scenario.json's actual obstacle count -- nmpc_node's OCP
# obstacle-slot count is fixed at construction time, so this must be >= whatever
# scenario is launched (pad_obstacles() truncates silently if it's too small).
#
# dt (mmg_node/nmpc_node) and MAX_OBSTACLES (nmpc_node/map_node) must be kept
# numerically identical wherever they're repeated below. YAML anchors/aliases
# would let each have one literal source, but ROS2's own params-file parser
# (rcl_yaml_param_parser, a restricted C YAML implementation) rejects aliases
# outright ("Will not support aliasing") -- confirmed by trying it against this
# exact file. So these are plain duplicated literals; section 7's validation
# run explicitly checks both nodes' *resolved* dt match via `ros2 param get`,
# per section 2.7's note that this drift is "the most likely silent bug in
# this migration."

mmg_node:
  ros__parameters:
    dt: 0.1

    # Sensor noise (formerly sensor_node): SENSOR_NOISE_MODEL.md's noise
    # pipeline, run in-process on every tick before /nmpc/solve. sensor_enabled:
    # false == pass through, i.e. exactly the no-noise behavior the sim had
    # before this was folded in. There is no partial-disable mode; false
    # removes ALL of it.
    sensor_enabled: true
    # "light": SENSOR_NOISE_MODEL.md section 4 placeholder values.
    # "sbg_ellipse_n": derived from the real SBG Systems Ellipse-N GNSS-aided
    # INS datasheet -- see sensor_model/config.py's SBG_ELLIPSE_N for the full
    # provenance/derivation. MUST match ukf_node.sensor_preset below.
    sensor_preset: "sbg_ellipse_n"
    sensor_seed: 233         # one run == one seed, for reproducible noise trajectories

    # true: /nmpc/solve's request.state is populated from ukf_node's estimate.
    # false: populated from the TRUE state directly -- bypasses sensor noise
    # AND the UKF entirely. Independent of sensor_enabled above (which only
    # controls whether /sensor/measured_state itself carries injected noise --
    # ukf_node always runs and is always logged/published regardless of this
    # flag, so its estimate stays available for observability either way).
    use_ukf: true
    # Current/wave disturbance (formerly env_node): WAVE_CURRENT_DISTURBANCE_PLAN.md,
    # sampled in-process on every tick and fed into the plant integrator only --
    # the NMPC's own prediction model never sees it. Independent toggles.
    current_enabled: true        # independent toggle
    current_mean_speed: 0.2       # [m/s]
    current_mean_heading: 0.77     # [rad], earth-fixed, same convention as psi
    # [s] Gauss-Markov Tc -- larger == slower wandering. 800s was arbitrary;
    # this vessel is a nearshore ASV (~1-2km from shoreline), where real current
    # variability is wind-driven (few-hour, superinertial response; storm-surge
    # currents ~half-day) plus tidal (deterministic, not OU, but same order --
    # M2 semidiurnal ~12.4h period) -- see research discussion, sourced from
    # nearshore current-meter/HF-radar literature. 21600s (6h) sits in that
    # range and stays >>1 order of magnitude above sensor_model's psi/r
    # Gauss-Markov bias tau (300s), so a UKF/observer can't easily alias one
    # into the other -- unlike the old 800s value, which was close enough to
    # that 300s bias tau to make the two statistically hard to separate. 21600, 0.000019
    current_time_constant: 21600.0
    current_sigma: 0.000019          # [m/s per sqrt(s)] driving noise intensity
    current_seed: 7649

    wave_enabled: true           # independent toggle
    wave_hs: 4.0                  # [m] significant wave height, scaled-model units
    wave_tp: 3.0                  # [s] peak period
    wave_gamma: 3.3                # JONSWAP peak-enhancement factor (3.3 = standard North Sea fit)
    wave_mean_heading: 0.2        # [rad] earth-fixed mean wave direction
    wave_num_components: 30       # spectral discretization for Newman's approximation
    wave_seed: 36534

ukf_node:
  ros__parameters:
    dt: 0.1                  # MUST match mmg_node.dt above (same drift-risk note)
    sensor_preset: "sbg_ellipse_n"   # MUST match mmg_node.sensor_preset -- sizes r_diag's default and the ax_bias/ay_bias/pos_bias_x/pos_bias_y AR(1) decay coefficients

    alpha: 0.001
    beta: 2.0
    kappa: 0.0

    # Sage-Husa adaptive noise estimation (ukf/ukf_core.py) -- R (and Q) are
    # recursively re-estimated online from the actual innovation sequence
    # each tick, rather than trusting q_diag/r_diag below as fixed for the
    # whole run. Added to fix a NEES-calibration gap (two tune_ukf.py passes
    # each converged their training seeds to mean_NEES~12 but held-out seeds
    # still ranged ~6-46) -- and it DID fix that (held-out avg NEES 22->11.8,
    # spread 5.9-45.8 -> 5.7-20.9). But NEES only measures whether the
    # filter's self-reported uncertainty matches its actual error, not
    # whether the point estimate itself is accurate -- adaptation achieved
    # better calibration by increasing Q (less smoothing, more aggressive
    # per-sample tracking), which directly hurt accuracy: vcx RMSE roughly
    # 3x worse on every one of 4 tested seeds (e.g. seed 233: 0.040 -> 0.132)
    # versus the same q_diag/r_diag with adaptation off. Left OFF by default
    # for that reason -- the static tune_ukf.py values below are themselves
    # a genuinely good, validated operating point (see their own comments).
    # Available for further experimentation, not a default recommendation.
    adapt_r: false
    adapt_q: false
    forgetting_factor: 0.98   # effective memory ~= 1/(1-this) samples (~50 samples = ~5s at dt=0.1s)

    # Multipliers on q_diag[8:12]'s LIVE physical value (see ukf/config.py's
    # bias_noise_diag()/load_ukf_config()) -- 1.0 = trust the physical model
    # as-is.
    #
    # accel_bias_q_scale RECHECKED 2026-08-25 (project owner noticed
    # state_ax_bias.png/state_ay_bias.png visually look "under-determined" --
    # true bias wanders over its full physical range while the UKF estimate
    # stays a near-flat, damped line -- same visual signature pos_bias had
    # before ITS fix below). Swept empirically in test_ukf.py
    # (1.194/5/15/30/60/120), and the outcome is DIFFERENT from pos_bias, not
    # a repeat of the same bug: ax_bias RMSE improves a little out to
    # scale~15-30 (0.00014->0.00011) but ay_bias gets steadily WORSE past
    # scale~5 (0.00012->0.00054 at 120), and vcx/vcy RMSE degrades right
    # alongside it (vcy goes from 4.4% better than the null baseline down to
    # 0.5% WORSE at scale=120). Interpretation: unlike pos_bias (GPS position
    # is a strong, low-noise measurement with real headroom to trust the bias
    # state more), accel bias has much less SNR to work with -- pushing its Q
    # up mostly means chasing the accelerometer's own white noise rather than
    # genuine bias, which is also why it starts contaminating the current
    # estimate. The near-flat look in the plot is closer to a genuine
    # observability/SNR limit (see ukf_core.py's own docstring on why accel
    # bias exists as a state at all -- it's only observable through predicted
    # vs measured accel residual, the same channel current itself competes
    # for) than a simple "Q too small" bug. Picked scale=5.0: the best point
    # in the sweep for BOTH ax_bias and ay_bias simultaneously, before ay's
    # degradation kicks in -- a small, unambiguous win, not the aggressive
    # trade pos_bias's fix was.
    accel_bias_q_scale: 5.0
    #
    # OLD note (2026-08-23 tune_ukf.py run, 8 train/4 val seeds, superseded by
    # the recheck above but kept for context): converged to accel_bias=1.194;
    # measured then against 1.0: ax_bias/ay_bias RMSE looked essentially
    # unchanged (0.00017->0.00016, 0.00012->0.00012) and vcx/vcy improved
    # slightly (0.00800->0.00751, 0.01147->0.01065) -- true as far as it went,
    # but that comparison never swept far enough to see ay_bias's later
    # degradation, since 1.194 sits well before the scale~5 knee.
    #
    # pos_bias_q_scale CORRECTED 2026-08-25 (separately from the above,
    # after switching test_ukf.py's maneuver to a turning circle and
    # noticing visible x/y trajectory drift in the state_xy.png plot,
    # specifically worse in the 2nd/3rd circle): the NEES-tuned 1.230 above
    # was a real, measured UNDER-tracking bug, not just a calibration
    # nicety -- state_pos_bias_x.png/state_pos_bias_y.png showed the UKF's
    # estimate as a damped, lagging copy of the true GPS bias (a real
    # Gauss-Markov process, tau=120s, that wanders 2-3m over a ~300s run),
    # undershooting every peak. That residual (true - estimate) shows up
    # directly as an x/y position offset, worst whenever the true bias
    # happens to be furthest from 0 (t~150-250s in that run, i.e. circles
    # 2-3, not circle 1). Swept pos_bias_q_scale empirically in test_ukf.py
    # (1.23/3/6/10/20/40/80): x RMSE 0.562->0.192, y RMSE 0.822->0.420,
    # pos_bias_x/y RMSE each nearly halved, all with a clear knee around
    # scale~20 -- x/y and pos_bias's OWN RMSE had already captured most of
    # the achievable gain by then, and pos_bias's own RMSE started creeping
    # back UP again by scale=40/80 (filter overreacting to GPS white noise).
    # vcx/vcy RMSE improved too as a side effect (less pos_bias
    # misattribution bleeding into current), same pattern as
    # accel_bias_q_scale above. No filter update failures at any scale
    # tested. Picked 20.0 as the practical sweet spot, not the point of
    # maximum single-metric improvement -- re-sweep if sensor_preset or
    # pos_bias_tau changes materially.
    pos_bias_q_scale: 20.0

    # [u,v,r,x,y,psi,vcx,vcy,ax_bias,ay_bias,pos_bias_x,pos_bias_y]
    # process-noise diag. FRESH tune_ukf.py run, 2026-08-23 (NEES search, 8
    # training seeds 1-8, validated on held-out seeds 233/42/9/10) -- rerun
    # from a corrected baseline after several bugs in the PREVIOUS tuning
    # pass were found and fixed (see project git history around this date):
    # vcx/vcy and ax_bias/ay_bias's starting points had been ~7147x and
    # ~4870x too large respectively (stale current_sigma literal;
    # "light"-preset accel_bias_sigma never updated for the "sbg_ellipse_n"
    # switch), the test/tune harness's own IC forced an avoidable transient
    # into the single most current-unobservable window of every rollout, and
    # the UKF used to seed vcx/vcy at 0 rather than the configured mean.
    #
    # "current" (vcx/vcy, index 6,7) is DELIBERATELY EXCLUDED from this
    # search -- see tune_ukf.py's own _GROUPS comment: NEES-consistency can't
    # tell "P is big because current is genuinely uncertain" from "P is big
    # because Q got inflated to paper over misattributed error", which is
    # exactly the mechanism that produced the ~7147x bug above. It stays
    # pinned at the physically-derived value (current_sigma**2*dt =
    # 0.000019**2*0.1 = 3.61e-11) regardless of what this search finds for
    # everything else -- this project's stated priority is vcx/vcy accuracy,
    # not NEES calibration, and that pairing (physical Q + p0_diag's
    # OU-stationary-variance prior + seeding at the configured mean, see
    # p0_diag's comment below) measured vcx/vcy RMSE of 0.00028/0.00054 m/s
    # against a true ~0.1/0.0 m/s signal in test_ukf.py -- reconfirm this
    # with test_ukf.py after any change near here before trusting a new
    # tune_ukf.py run's numbers blindly.
    #
    # This run's converged group scales (applied to the OTHER groups' own
    # physically-derived starting points, current excluded as above):
    # uv=0.613, psi_r=2.000, xy=0.838, accel_bias=0.926, pos_bias=1.447,
    # r=1.950. Held-out NEES: baseline (pre-tune, current/accel_bias already
    # fixed) avg=50.92 (per-seed 8.92/74.66/113.41/6.67) -> tuned avg=27.24
    # (6.17/40.02/58.69/4.09) -- improved but still far from the target 12
    # for 2 of 4 held-out seeds. Not a bug: this project's own prior findings
    # (see ukf/ukf_core.py's module docstring on Sage-Husa) already show
    # per-seed Gauss-Markov draw variance is large enough that one fixed
    # Q/R can't calibrate every realization equally well -- seeds 42/9
    # happened to draw wilder bias trajectories than 233/10 regardless of
    # tuning. Re-run tune_ukf.py after any material sensor_model/env_model
    # config change, or this goes stale the same way past runs did.
    # SUPERSEDED 2026-08-25 for accel_bias/pos_bias specifically: their
    # 0.926/1.447 scales above are historical (from tuning against a q_diag
    # literal, before the live-physical override existed) -- the ACTIVE
    # scales are accel_bias_q_scale/pos_bias_q_scale above (1.194/1.230, a
    # fresh 2026-08-25 tune_ukf.py run against the new physical baseline).
    # NOTE 2026-08-25: indices 6,7 (vcx/vcy) below are LITERAL/DOCUMENTATION
    # ONLY -- both ukf_node.py and ukf/config.py's load_ukf_config() now
    # OVERRIDE these two slots at load time with current_noise_diag(), a live
    # derivation from mmg_node's actual current_sigma/current_time_constant
    # above (see ukf/config.py). This closed a real bug: changing
    # current_sigma/current_time_constant for a test (e.g. a faster-varying
    # current) silently left this hand-copied literal sized for the OLD
    # current's dynamics, so the filter's Q said "current barely moves" while
    # the true current was actually moving fast -- it got smoothed away
    # instead of tracked. Editing the 6,7 values here now has NO EFFECT;
    # left in place only so this array's shape/units stay self-documenting.
    # Indices 8,9,10,11 (ax_bias/ay_bias/pos_bias_x/pos_bias_y) CORRECTED
    # 2026-08-25: same LITERAL/DOCUMENTATION ONLY treatment as 6,7, now also
    # overridden live with bias_noise_diag() from the active sensor preset's
    # accel_bias_sigma/tau, pos_bias_sigma/tau, TIMES accel_bias_q_scale/
    # pos_bias_q_scale above. Before this these were an absolute literal =
    # a hand-derived physical baseline times tune_ukf.py's found NEES-search
    # group_scale (see _GROUPS/_expand_q), baked together into one number;
    # now the physical part is always live and only the scale is a settable
    # yaml value, so a sensor_preset change can't leave the physical part
    # stale while still letting tune_ukf.py's tuning apply. See
    # accel_bias_q_scale/pos_bias_q_scale above for the current value and
    # its measured effect. Editing 8-11 here now has NO EFFECT.
    q_diag: [3.4809e-05, 3.4809e-05, 6.1521e-06, 8.6665e-05, 8.6665e-05, 9.8481e-07, 3.6100e-11, 3.6100e-11, 1.1630e-11, 1.1630e-11, 2.1821e-03, 2.1821e-03]

    # [x,y,psi,r,ax,ay] measurement-noise diag -- also this fresh tune_ukf.py
    # run's output (R group scale = 1.950, applied to default_r_diag()'s
    # white-noise-only derivation for the "sbg_ellipse_n" preset). Accel bias
    # and GPS position bias are tracked explicitly as ax_bias/ay_bias/
    # pos_bias_x/pos_bias_y states (see q_diag/p0_diag) rather than folded
    # into R -- widening R to account for accel bias alone was tried first
    # (before state augmentation existed) and barely helped (R only
    # discounts trust per-sample, it can't represent that the error is
    # correlated across time); see ukf/config.py's default_r_diag()
    # docstring for the full story. psi/r's own bias terms are still not
    # separately tracked -- empirically a much smaller effect than pos bias
    # (disabling psi_bias/r_bias individually changed nothing measurable).
    # Omit this key to fall back to default_r_diag()'s derivation
    # automatically (ukf_node.py does this at parameter-declare time); set it
    # explicitly here (as done) to keep tune_ukf.py's validated result.
    r_diag: [2.4378e+00, 2.4378e+00, 2.1124e-04, 8.9112e-08, 1.0156e-05, 1.0156e-05]

    # [u,v,r,x,y,psi,vcx,vcy,ax_bias,ay_bias,pos_bias_x,pos_bias_y] initial
    # covariance diag -- position/heading tight (seeded exactly from
    # /map/initial_state), ax_bias/ay_bias = accel_bias_sigma**2,
    # pos_bias_x/pos_bias_y = pos_bias_sigma**2 (both matching GaussMarkov's
    # own b_0 ~ N(0, sigma_b**2) initial draw). ax_bias/ay_bias/pos_bias_x/
    # pos_bias_y entries updated for the "sbg_ellipse_n" preset's
    # accel_bias_sigma=1.3729e-4, pos_bias_sigma=1.2247 (not part of
    # tune_ukf.py's own search -- these are the physically-derived values,
    # recomputed by hand from sensor_model/config.py's SBG_ELLIPSE_N).
    #
    # vcx/vcy CORRECTED 2026-08-23: was 0.0025 ("current wide -- totally
    # unknown at startup"). Retuned to the current OU process's own
    # STATIONARY variance -- sigma**2*Tc/2 = 0.000019**2*21600/2 = 3.8988e-06
    # (std=0.00197 m/s, ~2% of the 0.1 m/s nominal current) -- the
    # mathematically-correct prior uncertainty for "what is the current right
    # now" given only the OU process's own long-run statistics and no
    # observation yet (the standard stationary-variance formula for an OU
    # process dX=-(X-mean)/Tc*dt+sigma*dW; contrast with q_diag's vcx/vcy,
    # which is the process's much-smaller PER-STEP/incremental variance, a
    # different quantity). This is only a net win paired with ukf_node.py's
    # (and test_ukf.py's/tune_ukf.py's) matching fix to seed vcx/vcy at
    # CurrentConfig's own mean instead of always 0 -- verified empirically
    # (3 seeds): tightening p0 alone, still seeded at 0, made vcx RMSE ~3x
    # WORSE (0.0133->0.0420 at this exact value) since the filter starts
    # confidently wrong and its own small q_diag then keeps it wrong for a
    # long time; tightening p0 WITH the seed fix made it ~2x BETTER
    # (0.0133->0.0060, improving further at even tighter p0 with no
    # instability observed down to 1e-5 -- this value keeps a safety margin
    # above that floor rather than chasing it, since it trades on trusting
    # current_mean_speed/current_mean_heading to be a genuinely reasonable
    # estimate of the true current at mission start, not a real-time one).
    # NOTE 2026-08-25: indices 6,7 (vcx/vcy) below are likewise LITERAL/
    # DOCUMENTATION ONLY now -- same live current_noise_diag() override as
    # q_diag above (its p0 branch: sigma**2*Tc/2, unaffected by dt). Editing
    # the 6,7 values here has NO EFFECT. Same for 8,9,10,11
    # (ax_bias/ay_bias/pos_bias_x/pos_bias_y) -- bias_noise_diag()'s p0 branch
    # is just accel_bias_sigma**2/pos_bias_sigma**2 from the active preset.
    p0_diag: [0.01, 0.01, 3.046e-4, 0.25, 0.25, 7.615e-3, 3.8988e-06, 3.8988e-06, 1.8849e-8, 1.8849e-8, 1.5, 1.5]

nmpc_node:
  ros__parameters:
    N: 200
    dt: 0.1   # MUST match mmg_node.dt above
    LPP: 2.902
    R_ASV_FACTOR: 0.5

    DELTA_MIN: -0.7853981633974483    # -45 deg [rad]
    DELTA_MAX: 0.7853981633974483     # +45 deg [rad]
    DELTA_DOT_MIN: -0.5235987755982988  # -30 deg/s [rad/s]
    DELTA_DOT_MAX: 0.5235987755982988   # +30 deg/s [rad/s]

    RPS_MIN: -18.2
    RPS_MAX: 18.2
    RPS_DOT_MIN: -5.0
    RPS_DOT_MAX: 5.0

    U_REF: 0.70
    DELTA_TRIM: 0.0
    N_TRIM: 10.0

    BRAKE_DISTANCE: 8.0
    U_REF_MIN: 0.05

    EPS: 1.0e-6

    SIGMA: 0.2
    W_SLACK: 50.0
    OBSTACLE_START_K: 1
    MAX_OBSTACLES: 20   # MUST be >= map_node.max_obstacles below

    Q_DIAG: [10.0, 2.0, 2.0, 0.5, 5.0, 5.0, 30.0, 100.0, 5.0, 0.001, 0.001]
    R_DIAG: [0.01, 0.01]
    QE_SCALE: 2.0

    ACADOS_QP_SOLVER: "PARTIAL_CONDENSING_HPIPM"
    ACADOS_NLP_SOLVER: "SQP_RTI"
    ACADOS_INTEGRATOR: "ERK"
    ACADOS_NUM_STAGES: 4
    ACADOS_NUM_STEPS: 1
    # ACADOS_CODE_EXPORT_DIR / ACADOS_JSON_FILE intentionally omitted: nmpc_node
    # defaults them to ~/.ros/nmpc_sim_nodes/acados_generated/ (see _pkg_paths.py),
    # which avoids the cwd-dependent packaging gotcha noted in plan section 2.6.

map_node:
  ros__parameters:
    # scenario_path intentionally omitted: map_node defaults it to the
    # scenario.json installed alongside this file (share/nmpc_sim_nodes/params/),
    # resolved via ament_index_python -- not a repo-relative path. Override here
    # with an absolute path to use a different scenario.
    wp_radius: 2.0
    sim_time_mode: "endpoint"   # "infinite" | "fixed" | "endpoint"
    sim_time_fixed: 300.0
    max_obstacles: 20   # MUST match nmpc_node.MAX_OBSTACLES above

logger_node:
  ros__parameters:
    # log_dir intentionally omitted: defaults to nmpc_sim_logs/experiments in the repo root
    run_name: "nmpc_experiment"
    save_horizons_npz: true

    # costs_errors.csv (ControllerEffortLogger) -- Q_DIAG/R_DIAG/rate bounds are
    # NOT repeated here: they're read from this same file's nmpc_node section via
    # nmpc.params.DEFAULT_CONFIG, so the cost breakdown can never drift from the
    # weights the solver is actually running with.
    R_DELTA_DIAG: [0.0, 0.0]   # diagnostic-only rate-of-rate weight -- NOT part of the actual NMPC objective (no R_delta term exists in nmpc_acados.py's cost); zero means J_du/rdelta_term columns are always 0 unless you opt in here
    saturation_tol: 1.0e-3
    rolling_window: 50
    effort_queue_maxsize: 500
    costs_errors_flush_every: 10
